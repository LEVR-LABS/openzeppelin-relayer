name: Openzeppelin Relayer CI/CD Pipeline
on:
  push:
    branches: [main, devops, levr-v1-staging, levr-v1-main]
    # paths:
    #     - "oracle/core/**"

# Global environment variables
env:
  ECR_REPOSITORY_APP: levr-v1-openzeppelin-relayer
  APP_DIR: "${{ github.workspace }}"
  LAMBDA_FUNCTION_NAME: upload_to_efs
  ECS_CLUSTER: levr-v1-cluster
  ECS_SERVICE: openzeppeline
  ECS_TASK_DEFINITION_FAMILY: openzeppeline
  CONTAINER_NAME: openzeppeline
  SECRET_NAME: levr-v1/openzeppeline-relayer

jobs:
  build-and-push-ecr:
    runs-on: ubuntu-latest
    steps:
      - name: check push branch
        id: env_check
        run: |
          echo "Running on branch ${{ github.ref }}"

          if   [ "${{ github.ref }}" = "refs/heads/devops" ]; then
              echo "::set-output name=ENV_NAME_TAG::dev"
              echo "::set-output name=AWS_ACCESS_KEY_ID_NAME::AWS_ACCESS_KEY_ID"
              echo "::set-output name=AWS_SECRET_ACCESS_KEY_NAME::AWS_SECRET_ACCESS_KEY"
              echo "::set-output name=AWS_ACCOUNT_ID::V1_DEV_AWS_ACCOUNT_ID"
              echo "::set-output name=CONFIG_NAME::config.levr.json"
              echo "::set-output name=SECRET_NAME::levr-v1/openzeppeline-relayer"

          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
              echo "::set-output name=ENV_NAME_TAG::test"

          elif [ "${{ github.ref }}" = "refs/heads/levr-v1-main" ]; then
              echo "::set-output name=ENV_NAME_TAG::prod"
              echo "::set-output name=AWS_ACCESS_KEY_ID_NAME::PROD_AWS_ACCESS_KEY_ID"
              echo "::set-output name=AWS_SECRET_ACCESS_KEY_NAME::PROD_AWS_SECRET_ACCESS_KEY"
              echo "::set-output name=AWS_ACCOUNT_ID::PROD_AWS_ACCOUNT_ID"
              echo "::set-output name=CONFIG_NAME::config.prod.levr.json"
              echo "::set-output name=SECRET_NAME::levr-v1/openzeppeline-relayer"

          elif [ "${{ github.ref }}" = "refs/heads/levr-v1-staging" ]; then
              echo "::set-output name=ENV_NAME_TAG::levr-v1-staging"
              echo "::set-output name=AWS_ACCESS_KEY_ID_NAME::STAGING_AWS_ACCESS_KEY_ID"
              echo "::set-output name=AWS_SECRET_ACCESS_KEY_NAME::STAGING_AWS_SECRET_ACCESS_KEY"
              echo "::set-output name=AWS_ACCOUNT_ID::STAGING_AWS_ACCOUNT_ID"
              echo "::set-output name=CONFIG_NAME::config.staging.levr.json"
              echo "::set-output name=SECRET_NAME::levr-v1/openzeppeline-relayer"


          fi
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set unique Docker image tag
        id: set-tag
        run: echo "::set-output name=TAG::$(date '+%Y%m%d%H%M%S')-${{ github.run_id }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets[steps.env_check.outputs.AWS_ACCESS_KEY_ID_NAME] }}
          aws-secret-access-key: ${{ secrets[steps.env_check.outputs.AWS_SECRET_ACCESS_KEY_NAME] }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Generate config file
        id: generate-config
        env:
          SECRET_NAME: ${{ steps.env_check.outputs.SECRET_NAME }}
        run: |
          mv ${APP_DIR}/config/${{ steps.env_check.outputs.CONFIG_NAME }} ${APP_DIR}/config/config.json
          ls -al ${APP_DIR}/config

          SECRET_JSON=$(aws ssm get-parameter --name /aws/reference/secretsmanager/${SECRET_NAME} --with-decryption | jq -r '.Parameter.Value')

          if [ "${{ steps.env_check.outputs.ENV_NAME_TAG }}" = "prod" ] || [ "${{ steps.env_check.outputs.ENV_NAME_TAG }}" = "levr-v1-staging" ]; then
            MONAD_MAINNET_RPC_URL_1=$(echo "$SECRET_JSON" | jq -r '.MONAD_MAINNET_RPC_URL_1')
            MONAD_MAINNET_RPC_URL_2=$(echo "$SECRET_JSON" | jq -r '.MONAD_MAINNET_RPC_URL_2')
            echo "Substituting mainnet RPC URLs..."
            sed -i "s|\${MONAD_MAINNET_RPC_URL_1}|$MONAD_MAINNET_RPC_URL_1|g" ${APP_DIR}/config/config.json
            sed -i "s|\${MONAD_MAINNET_RPC_URL_2}|$MONAD_MAINNET_RPC_URL_2|g" ${APP_DIR}/config/config.json
          else
            MONAD_TESTNET_RPC_URL_1=$(echo "$SECRET_JSON" | jq -r '.MONAD_TESTNET_RPC_URL_1')
            echo "Substituting testnet RPC URL..."
            sed -i "s|MONAD_TESTNET_RPC_URL_1|$MONAD_TESTNET_RPC_URL_1|g" ${APP_DIR}/config/config.json
          fi

          cat ${APP_DIR}/config/config.json
          echo "PAYLOAD=$(jq -c . ${APP_DIR}/config/config.json)" >> $GITHUB_OUTPUT

      - name: Upload to EFS via Lambda
        run: |
          aws lambda invoke \
            --function-name upload_to_efs \
            --cli-binary-format raw-in-base64-out \
            --payload '${{ steps.generate-config.outputs.PAYLOAD }}' \
            response.json

          echo "Response:"
          cat response.json

          # Check response
          if grep -q '"statusCode": 200' response.json; then
            echo "✅ Config uploaded successfully to EFS"
          else
            echo "❌ Upload failed"
            cat response.json
            exit 1
          fi

      - name: Upload networks folder files to EFS via Lambda
        run: |
          NETWORKS_DIR="${APP_DIR}/config/networks"

          ls -al "$NETWORKS_DIR"

          if [ -d "$NETWORKS_DIR" ] && [ "$(ls -A "$NETWORKS_DIR")" ]; then
            for file in "$NETWORKS_DIR"/*; do
              filename=$(basename "$file")
              filepath="networks/$filename"

              echo "📤 Uploading $filepath"

              # Read file content safely
              content=$(cat "$file")

              # Wrap into a JSON payload
              PAYLOAD=$(jq -n \
                --arg filename "$filepath" \
                --argjson payload "$content" \
                '{filename: $filename, payload: $payload}')

              aws lambda invoke \
                --function-name upload_to_efs \
                --cli-binary-format raw-in-base64-out \
                --payload "$PAYLOAD" \
                response.json

              echo "Response for $filepath:"
              cat response.json

              if grep -q '"statusCode": 200' response.json; then
                echo "✅ $filepath uploaded successfully to EFS"
              else
                echo "❌ Upload failed for $filepath"
                cat response.json
                exit 1
              fi
            done
          else
            echo "⚠️ No files found in $NETWORKS_DIR, skipping upload."
          fi

      - name: Build and Push Docker Image to ECR (main)
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ secrets[steps.env_check.outputs.AWS_ACCOUNT_ID] }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_APP }}:${{ steps.set-tag.outputs.TAG }}, ${{ secrets[steps.env_check.outputs.AWS_ACCOUNT_ID] }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_APP }}:latest

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          # task-definition: ${{ env.ECS_TASK_DEFINITION }}
          # task-definition-arn: task-definition-arn
          task-definition-family: ${{ env.ECS_TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ secrets[steps.env_check.outputs.AWS_ACCOUNT_ID] }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_APP }}:${{ steps.set-tag.outputs.TAG }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # wait-for-service-stability: true

      - name: Discord Notification - Openzeppelin Relayer Service Deployment
        if: always()
        run: |
          # Determine status and color
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Success"
            COLOR=65280  # Green
            DESCRIPTION="Successfully deployed Openzeppelin Relayer Service to ${{ steps.env_check.outputs.ENV_NAME_TAG }}"
          elif [ "${{ job.status }}" == "failure" ]; then
            STATUS="❌ Failed"
            COLOR=16711680  # Red
            DESCRIPTION="Failed to deploy Openzeppelin Relayer Service to ${{ steps.env_check.outputs.ENV_NAME_TAG }}"
          elif [ "${{ job.status }}" == "cancelled" ]; then
            STATUS="⏹️ Cancelled"
            COLOR=16776960  # Yellow
            DESCRIPTION="Openzeppelin Relayer Service deployment was cancelled"
          else
            STATUS="⚠️ Unknown"
            COLOR=16776960  # Yellow
            DESCRIPTION="Openzeppelin Relayer Service deployment status unknown"
          fi

          # Get commit message
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" 2>/dev/null || echo "No commit message available")

          # Prepare webhook payload
          WEBHOOK_DATA=$(cat <<EOF
          {
            "username": "GitHub Actions - Openzeppelin Relayer Service",
            "content": null,
            "embeds": [
              {
                "type": "rich",
                "title": "🚀 Openzeppelin Relayer Service Deployment: $STATUS",
                "description": "$DESCRIPTION",
                "color": $COLOR,
                "fields": [
                  {
                    "name": "Service", 
                    "value": "Openzeppelin Relayer Service", 
                    "inline": true
                  },
                  {
                    "name": "Environment", 
                    "value": "${{ steps.env_check.outputs.ENV_NAME_TAG }}", 
                    "inline": true
                  },
                  {
                    "name": "Branch", 
                    "value": "${{ github.ref_name }}", 
                    "inline": true
                  },
                  {
                    "name": "Commit", 
                    "value": "[\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})", 
                    "inline": true
                  },
                  {
                    "name": "Image", 
                    "value": "${{ env.ECR_REPOSITORY_APP }}:latest", 
                    "inline": true
                  },
                  {
                    "name": "Deployment Method", 
                    "value": "ECS Service Update", 
                    "inline": true
                  },
                  {
                    "name": "Commit Message", 
                    "value": "$COMMIT_MSG", 
                    "inline": false
                  }
                ],
                "author": {
                  "name": "${{ github.actor }}",
                  "url": "https://github.com/${{ github.actor }}",
                  "icon_url": "https://avatars.githubusercontent.com/u/${{ github.actor_id }}?v=4"
                },
                "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
                "footer": {
                  "text": "Openzeppelin Relayer Service CI/CD Pipeline"
                }
              }
            ]
          }
          EOF
          )

          # Send webhook
          RESPONSE=$(curl -H "Content-Type: application/json" -X POST -d "$WEBHOOK_DATA" ${{ secrets.DISCORD_WEBHOOK_URL }})
          echo "Webhook server response: $RESPONSE"
